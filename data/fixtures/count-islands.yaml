id: count-islands
name: Count islands
display_name: Подсчёт островов (связных компонент)
category_id: search
description_short: BFS по каждой непосещённой 1-клетке, разные цвета для островов
description_full: Идём по матрице. Встретив 1 в клетке без метки — начинаем BFS от неё, помечаем всю связную
  компоненту новым id, красим в цвет по кругу (жёлтый, циан, оранж, маджента). таблица t — исходная, label
  — карта компонент (0 = не посещали, N = id острова).
complexity: O(N·M)
icon: 🏝
order_index: 133
