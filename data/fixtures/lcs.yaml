id: lcs
name: Longest Common Subsequence
display_name: Наибольшая общая подпоследовательность (LCS)
category_id: 2d-dynamics
description_short: dp[i][j] = dp[i-1][j-1]+1 или max(dp[i-1][j], dp[i][j-1])
description_full: Если s1[i-1]==s2[j-1], dp[i][j] = dp[i-1][j-1]+1. Иначе dp[i][j] = max(dp[i-1][j], dp[i][j-1]).
  Ответ = dp[n][m] — длина LCS.
complexity: O(n·m)
icon: LCS
order_index: 120
default_input_data:
  input_text1: abcde
  input_text2: ace
input_schema:
  input_text1:
    type: string
    constraints:
      min_length: 3
      max_length: 6
      label: Первая строка
  input_text2:
    type: string
    constraints:
      min_length: 3
      max_length: 6
      label: Вторая строка
default_settings:
  speed_factor: 1.0
definition_mode: python
definition_python: |
  w = Window("main")
  s1 = Vector(input_text1)
  s2 = Vector(input_text2)
  n = len(input_text1)
  m = len(input_text2)
  dp = Table(rows=n + 1, cols=m + 1, default=0)
  w.attach(s1)
  w.attach(s2)
  w.attach(dp)
  wait(500)

  for i in range(1, n + 1):
      for j in range(1, m + 1):
          s1.highlight(i - 1, "yellow")
          s2.highlight(j - 1, "yellow")
          wait(150)
          if s1.value_at(i - 1) == s2.value_at(j - 1):
              dp.highlight_cell(i - 1, j - 1, "cyan")
              val = dp.get(i - 1, j - 1) + 1
              dp.set(i, j, val)
              dp.highlight_cell(i, j, "green")
          else:
              dp.highlight_cell(i - 1, j, "cyan")
              dp.highlight_cell(i, j - 1, "cyan")
              up = dp.get(i - 1, j)
              left = dp.get(i, j - 1)
              if up > left:
                  dp.set(i, j, up)
              else:
                  dp.set(i, j, left)
              dp.highlight_cell(i, j, "orange")
          wait(300)
          s1.unhighlight(i - 1)
          s2.unhighlight(j - 1)
          dp.unhighlight_cell(i - 1, j - 1)
          dp.unhighlight_cell(i - 1, j)
          dp.unhighlight_cell(i, j - 1)
          dp.unhighlight_cell(i, j)
