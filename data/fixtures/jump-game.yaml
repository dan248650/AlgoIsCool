id: jump-game
name: Jump game II
display_name: Минимум прыжков до конца
category_id: dynamics
description_short: 'dp[i] = min(dp[j]+1 : j + a[j] >= i)'
description_full: dp[i] — минимум прыжков, чтобы достичь позиции i. Из j можно допрыгнуть до i, если j
  + input_array[j] >= i. Ответ = dp[n-1] (или -1, если недостижимо).
complexity: O(n²)
icon: ↑
order_index: 114
default_input_data:
  input_array:
  - 2
  - 3
  - 1
  - 1
  - 4
input_schema:
  input_array:
    type: array
    constraints:
      min_length: 4
      max_length: 8
      min_value: 1
      max_value: 4
default_settings:
  speed_factor: 1.0
definition_mode: python
definition_python: |
  w = Window("main")
  arr = Vector(input_array)
  dp = Vector([])
  w.attach(arr)
  w.attach(dp)
  n = len(input_array)
  for k in range(n):
      dp.append(-1)
  wait(500)

  dp.set(0, 0)
  arr.highlight(0, "yellow")
  dp.highlight(0, "green")
  wait(400)
  arr.unhighlight(0)
  dp.unhighlight(0)

  for i in range(1, n):
      arr.highlight(i, "yellow")
      wait(300)
      best = -1
      for j in range(0, i):
          if dp.value_at(j) != -1:
              reach = j + input_array[j]
              arr.highlight(j, "cyan")
              dp.highlight(j, "cyan")
              wait(200)
              if reach >= i:
                  cand = dp.value_at(j) + 1
                  arr.highlight(j, "green")
                  dp.highlight(j, "green")
                  wait(150)
                  if best == -1 or cand < best:
                      best = cand
                  arr.highlight(j, "cyan")
                  dp.highlight(j, "cyan")
              else:
                  arr.highlight(j, "red")
              wait(200)
              arr.unhighlight(j)
              dp.unhighlight(j)
      if best != -1:
          dp.set(i, best)
          dp.highlight(i, "green")
      else:
          dp.highlight(i, "red")
      wait(300)
      dp.unhighlight(i)
      arr.unhighlight(i)
