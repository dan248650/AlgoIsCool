id: bst-search
name: Поиск в BST
display_name: Поиск в двоичном дереве поиска
category_id: tree
description_short: Поиск элемента в BST с подсветкой пути
description_full: 'На каждом шаге сравниваем значение с текущим узлом: идём влево, вправо или останавливаемся.
  При успехе подсвечивается весь путь от корня до найденного узла.'
complexity: O(log n) в среднем
icon: tree
order_index: 55
default_input_data:
  input_array:
  - 50
  - 30
  - 70
  - 20
  - 40
  - 60
  - 80
  target: 40
input_schema:
  input_array: array
  target: number
default_settings:
  speed_factor: 1.0
definition_mode: python
definition_python: |
  w = Window("main")
  root_id = input_array[0]
  root_node = {"id": root_id, "label": str(root_id)}
  t = Tree(nodes=[root_node], edges=[], root_id=root_id, layout="hierarchical")
  w.attach(t)

  # Мгновенное построение BST
  for i in range(1, len(input_array)):
      value = input_array[i]
      current = root_id
      while True:
          cv = t.value_of(current)
          children = t.children_of(current)
          if value < cv:
              if len(children) > 0:
                  if t.value_of(children[0]) < cv:
                      current = children[0]
                      continue
              t.add_child(current, value, str(value))
              break
          elif value > cv:
              if len(children) > 0:
                  if t.value_of(children[-1]) > cv:
                      current = children[-1]
                      continue
              t.add_child(current, value, str(value))
              break
          else:
              if len(children) > 0:
                  if t.value_of(children[-1]) >= cv:
                      current = children[-1]
                      continue
              t.add_child(current, value, str(value))
              break

  wait(300)

  # Поиск target с подсветкой пути
  current = root_id
  found = False
  while True:
      t.highlight_node(current, "yellow")
      wait(300)
      if t.value_of(current) == target:
          t.highlight_path(root_id, current, "green")
          wait(600)
          found = True
          break
      cv = t.value_of(current)
      children = t.children_of(current)
      if target < cv:
          if len(children) > 0:
              if t.value_of(children[0]) < cv:
                  t.unhighlight_node(current)
                  current = children[0]
                  continue
          break
      else:
          if len(children) > 0:
              if t.value_of(children[-1]) >= cv:
                  t.unhighlight_node(current)
                  current = children[-1]
                  continue
          break

  if not found:
      t.highlight_node(current, "red")
      wait(600)
