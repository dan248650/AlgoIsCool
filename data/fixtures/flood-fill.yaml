id: flood-fill
name: Flood fill
display_name: Заливка области (Flood fill)
category_id: search
description_short: Смена цвета связной области через стек (DFS)
description_full: 'Начинаем с клетки (start_r, start_c). Кладём её в стек. Пока стек не пуст: берём клетку,
  если её цвет = old_color — красим в new_color и добавляем соседей в стек. Классика заливки (как в Paint).'
complexity: O(N·M)
icon: 🌊
order_index: 131
