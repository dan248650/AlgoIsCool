id: game-of-life
name: Game of Life
display_name: Игра «Жизнь» (Conway)
category_id: search
description_short: 'Клеточный автомат: 4 поколения по правилам 23/3'
description_full: 'Правила: живая клетка выживает при 2–3 живых соседях, мёртвая оживает при ровно 3.
  Каждое поколение — проход по всем клеткам по снимку предыдущего состояния. Зелёный — живые, оранжевый
  — мёртвые. 4 поколения.'
complexity: O(G·NM)
icon: 🦠
order_index: 132
