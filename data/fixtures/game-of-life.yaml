input_schema:
  input_matrix:
    type: table
    constraints:
      min_rows: 5
      max_rows: 7
      min_cols: 5
      max_cols: 7
      integer: true
      min_value: 0
      max_value: 1
      label: Сетка (0/1)
default_settings:
  speed_factor: 2.0
definition_mode: python
definition_python: |
  w = Window("main")
  t = Table(input_matrix)
  snap = Table(input_matrix)
  w.attach(t)
  wait(500)

  n = t.rows()
  m = t.cols()

  for gen in range(0, 4):
      for r in range(0, n):
          for c in range(0, m):
              snap.set(r, c, t.get(r, c))
      for r in range(0, n):
          for c in range(0, m):
              cnt = 0
              for dr in range(-1, 2):
                  for dc in range(-1, 2):
                      if dr == 0:
                          if dc == 0:
                              continue
                      nr = r + dr
                      nc = c + dc
                      if nr >= 0 and nr < n and nc >= 0 and nc < m:
                          if snap.get(nr, nc) == 1:
                              cnt = cnt + 1
              old = snap.get(r, c)
              nv = 0
              if old == 1:
                  if cnt == 2: nv = 1
                  if cnt == 3: nv = 1
              else:
                  if cnt == 3: nv = 1
              t.set(r, c, nv)
              if nv == 1:
                  t.highlight_cell(r, c, "green")
              else:
                  t.highlight_cell(r, c, "orange")
      wait(800)
      for r in range(0, n):
          for c in range(0, m):
              t.unhighlight_cell(r, c)
      wait(200)
