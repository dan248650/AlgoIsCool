id: matrix-multiplication
name: Matrix multiplication
display_name: Умножение матриц
category_id: search
description_short: C[r][cc] = сумма A[r][j] · B[j][cc]
description_full: 'Каждая клетка результирующей матрицы C — скалярное произведение строки r матрицы A
  на столбец cc матрицы B. При вычислении C[r][cc] подсвечивается строка r в A и столбец cc в B, затем
  идёт по j от 0 до m-1, умножая пары. Требование: число столбцов A = числу строк B.'
complexity: O(n·m·k)
icon: ×
order_index: 130
default_input_data:
  input_matrix_a:
  - - 1
    - 2
    - 3
  - - 4
    - 5
    - 6
  - - 7
    - 8
    - 9
  input_matrix_b:
  - - 2
    - 0
    - 1
  - - 1
    - 3
    - 0
  - - 0
    - 1
    - 2
input_schema:
  input_matrix_a:
    type: table
    constraints:
      min_rows: 2
      max_rows: 4
      min_cols: 2
      max_cols: 4
      integer: true
      min_value: -9
      max_value: 9
      label: Матрица A
  input_matrix_b:
    type: table
    constraints:
      min_rows: 2
      max_rows: 4
      min_cols: 2
      max_cols: 4
      integer: true
      min_value: -9
      max_value: 9
      label: Матрица B (число строк = числу столбцов A)
    depends_on:
      field: input_matrix_a
      mode: rows_equal_cols_of
default_settings:
  speed_factor: 2.0
definition_mode: python
definition_python: |
  w = Window("main")
  A = Table(input_matrix_a)
  B = Table(input_matrix_b)
  n = len(input_matrix_a)
  m = len(input_matrix_a[0])
  k = len(input_matrix_b[0])
  C = Table(rows=n, cols=k, default=0)
  w.attach(A)
  w.attach(B)
  w.attach(C)
  wait(500)

  for r in range(0, n):
      for cc in range(0, k):
          C.highlight_row(r, "yellow")
          C.highlight_col(cc, "cyan")
          wait(200)
          total = 0
          for j in range(0, m):
              A.highlight_cell(r, j, "orange")
              B.highlight_cell(j, cc, "orange")
              wait(150)
              total = total + A.get(r, j) * B.get(j, cc)
              A.unhighlight_cell(r, j)
              B.unhighlight_cell(j, cc)
          C.set(r, cc, total)
          C.highlight_cell(r, cc, "green")
          wait(300)
          C.unhighlight_row(r)
          C.unhighlight_col(cc)
          C.unhighlight_cell(r, cc)
