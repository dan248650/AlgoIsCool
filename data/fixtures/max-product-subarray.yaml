id: max-product-subarray
name: Maximum product subarray
display_name: Максимальное произведение подмассива
category_id: dynamics
description_short: Два состояния max/min из-за смены знака при отрицательных
description_full: 'Ведём два массива: max_dp[i] — максимальное произведение подмассива, заканчивающегося
  на i, min_dp[i] — минимальное (может стать максимальным при умножении на отрицательное). hi = max(max_dp[i-1]*a[i],
  min_dp[i-1]*a[i], a[i]), lo = min(...).'
complexity: O(n)
icon: ×
order_index: 113
default_input_data:
  input_array:
  - 2
  - 3
  - -2
  - 4
  - -1
  - 2
  - -3
input_schema:
  input_array:
    type: array
    constraints:
      min_length: 4
      max_length: 8
      min_value: -5
      max_value: 5
      has_negatives: true
default_settings:
  speed_factor: 1.0
definition_mode: python
definition_python: |
  w = Window("main")
  arr = Vector(input_array)
  max_dp = Vector([])
  min_dp = Vector([])
  w.attach(arr)
  w.attach(max_dp)
  w.attach(min_dp)
  n = len(input_array)
  for k in range(n):
      max_dp.append(0)
      min_dp.append(0)
  wait(500)

  max_dp.set(0, input_array[0])
  min_dp.set(0, input_array[0])
  best = input_array[0]
  arr.highlight(0, "yellow")
  max_dp.highlight(0, "green")
  min_dp.highlight(0, "green")
  wait(400)
  arr.unhighlight(0)
  max_dp.unhighlight(0)
  min_dp.unhighlight(0)

  for i in range(1, n):
      arr.highlight(i, "yellow")
      max_dp.highlight(i - 1, "cyan")
      min_dp.highlight(i - 1, "cyan")
      wait(300)
      a = max_dp.value_at(i - 1) * input_array[i]
      b = min_dp.value_at(i - 1) * input_array[i]
      c = input_array[i]
      hi = a
      if b > hi:
          hi = b
      if c > hi:
          hi = c
      lo = a
      if b < lo:
          lo = b
      if c < lo:
          lo = c
      max_dp.set(i, hi)
      min_dp.set(i, lo)
      if hi > best:
          best = hi
      max_dp.highlight(i, "green")
      min_dp.highlight(i, "green")
      wait(400)
      max_dp.unhighlight(i - 1)
      min_dp.unhighlight(i - 1)
      max_dp.unhighlight(i)
      min_dp.unhighlight(i)
      arr.unhighlight(i)
