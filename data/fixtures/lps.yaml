id: lps
name: Longest Palindromic Subsequence
display_name: Наибольшая палиндромная подпоследовательность
category_id: 2d-dynamics
description_short: LCS(s, reverse(s)) — длина максимального палиндрома
description_full: Палиндромная подпоследовательность s совпадает с подпоследовательностью reverse(s).
  Задача сводится к LCS(s, reverse(s)). dp[i][j] — длина LPS для s[0..i-1] и reverse(s)[0..j-1].
complexity: O(n²)
icon: ↺
order_index: 124
default_input_data:
  input_string: bbabcbcab
input_schema:
  input_string:
    type: string
    constraints:
      min_length: 4
      max_length: 16
      alphabet: abcdef
default_settings:
  speed_factor: 1.0
definition_mode: python
definition_python: |
  w = Window("main")
  s = Vector(input_string)
  r = Vector(input_string)
  r.reverse()
  n = len(input_string)
  dp = Table(rows=n + 1, cols=n + 1, default=0)
  w.attach(s)
  w.attach(r)
  w.attach(dp)
  wait(600)

  for i in range(1, n + 1):
      for j in range(1, n + 1):
          s.highlight(i - 1, "yellow")
          r.highlight(j - 1, "yellow")
          wait(150)
          if s.value_at(i - 1) == r.value_at(j - 1):
              dp.highlight_cell(i - 1, j - 1, "cyan")
              val = dp.get(i - 1, j - 1) + 1
              dp.set(i, j, val)
              dp.highlight_cell(i, j, "green")
          else:
              dp.highlight_cell(i - 1, j, "cyan")
              dp.highlight_cell(i, j - 1, "cyan")
              up = dp.get(i - 1, j)
              left = dp.get(i, j - 1)
              if up > left:
                  dp.set(i, j, up)
              else:
                  dp.set(i, j, left)
              dp.highlight_cell(i, j, "orange")
          wait(300)
          s.unhighlight(i - 1)
          r.unhighlight(j - 1)
          dp.unhighlight_cell(i - 1, j - 1)
          dp.unhighlight_cell(i - 1, j)
          dp.unhighlight_cell(i, j - 1)
          dp.unhighlight_cell(i, j)
